# Ruff linter configuration for ScheduleSolver
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # Line length handled by line-length setting

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports OK in __init__.py
"tests/*" = ["E711"]  # Allow `== None` in test assertions
